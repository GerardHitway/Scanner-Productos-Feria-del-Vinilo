<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Escáner de stock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  :root{
    --bg:#14100e;
    --surface:#201a16;
    --surface-2:#2a221c;
    --line:#3a3128;
    --text:#f2e9de;
    --text-muted:#a79684;
    --accent:#c9622a;
    --gold:#d4af37;
    --error:#c0453a;
    --radius:18px;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    height:100%;
    height:100dvh;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */

  header{
    padding:16px 20px 12px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    z-index:5;
    background:var(--bg);
  }

  header .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
  }

  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    margin:2px 0 0;
    letter-spacing:-.01em;
  }

  #status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--text-muted);
    flex-shrink:0;
    transition:background .3s;
  }

  #status-dot.ready{
    background:#5fae7a;
  }

  #status-dot.error{
    background:var(--error);
  }

  .status-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
  }

  /* ---------- Scanner ---------- */

  #scanner-wrap{
    position:relative;
    flex:1;
    min-height:0;
    background:#000;
  }

  #reader{
    width:100%;
    height:100%;
  }

  #reader video{
    width:100% !important;
    height:100% !important;
    object-fit:cover !important;
    display:block;

    /* iOS Safari */
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
  }

  #reader__dashboard,
  #reader__header_message,
  #reader__filescan_input,
  #reader__camera_selection{
    display:none !important;
  }

  #reader__scan_region{
    border:none !important;
  }

  #reader__scan_region img{
    display:none !important;
  }

  .viewfinder{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /*
   * Zona más ancha para EAN/UPC.
   */
  .viewfinder .frame{
    width:88%;
    max-width:500px;
    aspect-ratio:2.4/1;
    position:relative;
  }

  .viewfinder .corner{
    position:absolute;
    width:28px;
    height:28px;
    border:3px solid var(--accent);
  }

  .viewfinder .corner.tl{
    top:0;
    left:0;
    border-right:none;
    border-bottom:none;
    border-top-left-radius:8px;
  }

  .viewfinder .corner.tr{
    top:0;
    right:0;
    border-left:none;
    border-bottom:none;
    border-top-right-radius:8px;
  }

  .viewfinder .corner.bl{
    bottom:0;
    left:0;
    border-right:none;
    border-top:none;
    border-bottom-left-radius:8px;
  }

  .viewfinder .corner.br{
    bottom:0;
    right:0;
    border-left:none;
    border-top:none;
    border-bottom-right-radius:8px;
  }

  .viewfinder .scanline{
    position:absolute;
    left:6%;
    right:6%;
    height:2px;
    background:linear-gradient(
      90deg,
      transparent,
      var(--accent),
      transparent
    );
    box-shadow:0 0 8px 1px var(--accent);
    animation:sweep 2.2s ease-in-out infinite;
  }

  @keyframes sweep{
    0%,100%{
      top:8%;
      opacity:.9;
    }

    50%{
      top:92%;
      opacity:.5;
    }
  }

  .hint{
    position:absolute;
    bottom:22px;
    left:0;
    right:0;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:.06em;
    color:var(--text-muted);
    text-shadow:0 1px 4px rgba(0,0,0,.8);
  }

  /* ---------- Camera error ---------- */

  #camera-error{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:32px;
    text-align:center;
    background:var(--bg);
    z-index:20;
  }

  #camera-error.show{
    display:flex;
  }

  #camera-error p{
    color:var(--text-muted);
    font-size:14px;
    line-height:1.5;
    margin:0;
  }

  #camera-error button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
  }

  /* ---------- iOS start ---------- */

  #ios-tap-start{
    position:fixed;
    inset:0;
    z-index:9998;
    background:rgba(0,0,0,.92);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    font-family:'Inter',sans-serif;
  }

  #ios-tap-start .ios-title{
    font-family:'Fraunces',serif;
    font-size:24px;
    margin-bottom:8px;
  }

  #ios-tap-start .ios-description{
    color:#cfc4b7;
    font-size:14px;
    line-height:1.5;
    max-width:320px;
  }

  #ios-tap-start button{
    margin-top:20px;
    padding:14px 28px;
    font-size:15px;
    border-radius:999px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:600;
  }

  /* ---------- Ticket ---------- */

  #ticket-scrim{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:8;
  }

  #ticket-scrim.show{
    opacity:1;
    pointer-events:auto;
  }

  #ticket{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:9;
    background:var(--surface);
    border-top-left-radius:24px;
    border-top-right-radius:24px;
    padding:10px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
    max-height:78vh;
    overflow-y:auto;
  }

  #ticket.show{
    transform:translateY(0);
  }

  #ticket::before{
    content:"";
    display:block;
    width:36px;
    height:4px;
    background:var(--line);
    border-radius:3px;
    margin:0 auto 18px;
  }

  .ticket-row-top{
    display:flex;
    gap:16px;
    align-items:flex-start;
  }

  .ticket-img{
    width:92px;
    height:92px;
    border-radius:10px;
    object-fit:cover;
    background:var(--surface-2);
    border:1px solid var(--line);
    flex-shrink:0;
  }

  .ticket-img.placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
    font-size:10px;
    font-family:'JetBrains Mono',monospace;
    text-align:center;
    padding:6px;
  }

  .ticket-main{
    min-width:0;
    flex:1;
  }

  .ticket-sku{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--accent);
    letter-spacing:.05em;
  }

  .ticket-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    line-height:1.2;
    margin:4px 0 2px;
  }

  .ticket-artist{
    color:var(--text-muted);
    font-size:14px;
  }

  .ticket-divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:18px 0 14px;
  }

  .price-grid{
    display:flex;
    gap:12px;
  }

  .price-card{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
  }

  .price-card .label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  .price-card .value{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:20px;
    color:var(--gold);
    margin-top:4px;
  }

  .price-card.club .value{
    color:var(--accent);
  }

  .ticket-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }

  #ticket-close,
  #ticket-save{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    padding:13px;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
  }

  #ticket-save{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  #ticket-save.saved{
    background:#5fae7a;
    border-color:#5fae7a;
  }

  /* ---------- Cart ---------- */

  #cart-bar{
    position:fixed;
    left:16px;
    right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:7;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px 18px;
    display:none;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }

  #cart-bar.show{
    display:flex;
  }

  #cart-bar .cart-count{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
  }

  #cart-bar .cart-total{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:16px;
    color:var(--gold);
  }

  #cart-sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:9;
    background:var(--surface);
    border-top-left-radius:24px;
    border-top-right-radius:24px;
    padding:10px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
    max-height:78vh;
    overflow-y:auto;
  }

  #cart-sheet.show{
    transform:translateY(0);
  }

  #cart-sheet::before{
    content:"";
    display:block;
    width:36px;
    height:4px;
    background:var(--line);
    border-radius:3px;
    margin:0 auto 16px;
  }

  #cart-sheet h2{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:600;
    margin:0 0 14px;
  }

  .cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }

  .cart-item .info{
    min-width:0;
  }

  .cart-item .info .t{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .cart-item .info .s{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--text-muted);
  }

  .cart-item .p{
    font-family:'JetBrains Mono',monospace;
    color:var(--gold);
    font-size:13px;
    flex-shrink:0;
    text-align:right;
    line-height:1.5;
  }

  .cart-item .p .club{
    color:var(--accent);
    display:block;
    font-size:11.5px;
  }

  .cart-item .rm{
    background:none;
    border:none;
    color:var(--error);
    font-size:18px;
    line-height:1;
    padding:4px 6px;
    flex-shrink:0;
  }

  .totals-block{
    margin-top:6px;
  }

  .cart-total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    font-family:'JetBrains Mono',monospace;
    border-bottom:1px solid var(--line);
  }

  .cart-total-row:last-of-type{
    border-bottom:none;
  }

  .cart-total-row .label{
    color:var(--text-muted);
    font-size:12.5px;
  }

  .cart-total-row .value{
    font-size:19px;
    font-weight:700;
    color:var(--gold);
  }

  .cart-total-row.club .value{
    color:var(--accent);
  }

  #cart-clear,
  #cart-close{
    width:100%;
    padding:13px;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    margin-top:10px;
  }

  #cart-close{
    background:var(--accent);
    border:1px solid var(--accent);
    color:#fff;
  }

  #cart-clear{
    background:transparent;
    border:1px solid var(--line);
    color:var(--error);
  }

  .not-found .ticket-title{
    color:var(--error);
  }

  .not-found-icon{
    font-family:'JetBrains Mono',monospace;
    font-size:34px;
    color:var(--error);
    text-align:center;
    margin-bottom:6px;
  }

  /* ---------- Debug ---------- */

  #debug-error-box{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:99999;
    background:#c0453a;
    color:#fff;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:10px;
    white-space:pre-wrap;
    max-height:40vh;
    overflow:auto;
  }
</style>
</head>

<body>

<header>
  <div>
    <div class="eyebrow">Punto de venta</div>
    <h1>Escanear producto</h1>
  </div>

  <div class="status-wrap">
    <span id="status-dot"></span>
    <span id="status-text">cargando catálogo…</span>
  </div>
</header>

<div id="scanner-wrap">

  <div id="reader"></div>

  <div class="viewfinder">
    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scanline"></div>
    </div>
  </div>

  <div class="hint">
    Apunta al código de barras
  </div>

  <div id="camera-error">

    <p>
      No pudimos acceder a la cámara.<br>
      Revisa los permisos del navegador y vuelve a intentar.
    </p>

    <button onclick="retryCamera()">
      Reintentar
    </button>

  </div>

</div>

<div id="ticket-scrim" onclick="closeTicket()"></div>
<div id="ticket"></div>

<div id="cart-bar" onclick="openCart()">
  <span class="cart-count" id="cart-count">
    0 productos
  </span>

  <span class="cart-total" id="cart-total">
    Ver Total
  </span>
</div>

<div id="cart-sheet"></div>

<script>

  /* =========================================================
     DEBUG
  ========================================================= */

  function showDebugError(msg){

    let box =
      document.getElementById(
        'debug-error-box'
      );

    if(!box){

      box =
        document.createElement(
          'div'
        );

      box.id =
        'debug-error-box';

      document.body.appendChild(
        box
      );

    }

    box.textContent +=
      (
        box.textContent
          ? "\n---\n"
          : ""
      ) + msg;

  }


  window.addEventListener(
    'error',
    (e) => {

      showDebugError(
        "JS ERROR: " +
        e.message +
        " (línea " +
        e.lineno +
        ")"
      );

    }
  );


  window.addEventListener(
    'unhandledrejection',
    (e) => {

      showDebugError(
        "PROMISE ERROR: " +
        (
          e.reason &&
          e.reason.message
            ? e.reason.message
            : e.reason
        )
      );

    }
  );


  /* =========================================================
     CONFIGURACIÓN
  ========================================================= */

  const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vRCTJ02RhdYcZqjlrKneeA7IUVq9TT-jhGAVRRY9X6XKIy038KNtfw1Tamao2yMyA/pub?gid=540197870&single=true&output=csv";


  const COLS = {

    sku:"SKU",

    artista:"Artista",

    titulo:"Título",

    precio:"Precio",

    precioClub:"Precio Club de lectores",

    imagen:"Imagen"

  };


  /* =========================================================
     DETECCIÓN IOS
  ========================================================= */

  const isIOS =
    /iPad|iPhone|iPod/.test(
      navigator.userAgent
    ) ||
    (
      navigator.platform ===
      "MacIntel" &&
      navigator.maxTouchPoints > 1
    );


  /* =========================================================
     VARIABLES
  ========================================================= */

  const statusDot =
    document.getElementById(
      'status-dot'
    );

  const statusText =
    document.getElementById(
      'status-text'
    );


  let catalogIndex = {};

  let catalogReady = false;

  let html5QrCode = null;

  let scannerLocked = false;

  let scannerStarting = false;

  let selectedCameraId = null;


  /* =========================================================
     FILTRO DE LECTURAS
  ========================================================= */

  let scanCandidate = "";

  let scanCandidateCount = 0;

  let lastAcceptedScan = "";

  let lastAcceptedTime = 0;


  /*
   * Android:
   * 1 lectura.
   *
   * iPhone:
   * 3 lecturas consecutivas iguales.
   *
   * De esta forma NO ralentizamos Android.
   */

  const REQUIRED_CONFIRMATIONS =
    isIOS ? 3 : 1;


  const ACCEPT_COOLDOWN =
    isIOS ? 1800 : 1000;


  /* =========================================================
     NORMALIZAR SKU
  ========================================================= */

  function normalizeSku(s){

    return (s || "")
      .toString()
      .trim()
      .toUpperCase();

  }


  /* =========================================================
     IMÁGENES
  ========================================================= */

  function toDirectImageUrl(url){

    if(!url)
      return "";

    url =
      url.trim();


    const driveMatch =
      url.match(
        /drive\.google\.com\/file\/d\/([^/]+)/
      );


    if(driveMatch){

      return (
        "https://drive.google.com/uc?export=view&id=" +
        driveMatch[1]
      );

    }


    const driveIdMatch =
      url.match(
        /[?&]id=([^&]+)/
      );


    if(
      driveIdMatch &&
      url.includes(
        'drive.google.com'
      )
    ){

      return (
        "https://drive.google.com/uc?export=view&id=" +
        driveIdMatch[1]
      );

    }


    return url;

  }


  /* =========================================================
     CARGAR CATÁLOGO
  ========================================================= */

  async function loadCatalog(){

    statusText.textContent =
      "cargando catálogo…";

    statusDot.className = "";


    try{

      const res =
        await fetch(
          SHEET_CSV_URL,
          {
            cache:"no-store"
          }
        );


      if(!res.ok){

        throw new Error(
          "HTTP " +
          res.status
        );

      }


      const csvText =
        await res.text();


      const parsed =
        Papa.parse(
          csvText,
          {
            header:true,
            skipEmptyLines:true
          }
        );


      catalogIndex = {};


      parsed.data.forEach(
        row => {

          const sku =
            normalizeSku(
              row[COLS.sku]
            );


          if(sku){

            catalogIndex[sku] =
              row;

          }

        }
      );


      catalogReady = true;

      statusDot.className =
        "ready";

      statusText.textContent =
        "";


    }catch(err){

      console.error(err);


      showDebugError(
        "Error cargando catálogo: " +
        err.message
      );


      statusDot.className =
        "error";


      statusText.textContent =
        "error al cargar catálogo";

    }

  }


  /* =========================================================
     PRECIOS
  ========================================================= */

  function formatPrice(v){

    if(
      v === undefined ||
      v === null ||
      v.toString().trim() === ""
    ){

      return "—";

    }


    const cleaned =
      v.toString()
        .replace(
          /[^\d.,-]/g,
          ''
        );


    return cleaned
      ? `$${cleaned}`
      : v;

  }


  function parsePrice(raw){

    if(
      raw === undefined ||
      raw === null
    ){

      return 0;

    }


    let s =
      raw
        .toString()
        .trim()
        .replace(
          /[^\d.,]/g,
          ''
        );


    if(!s)
      return 0;


    const hasDot =
      s.includes('.');

    const hasComma =
      s.includes(',');


    if(
      hasDot &&
      hasComma
    ){

      s =
        s
          .replace(
            /\./g,
            ''
          )
          .replace(
            ',',
            '.'
          );


    }else if(
      hasComma &&
      !hasDot
    ){

      s =
        s.replace(
          ',',
          '.'
        );


    }else if(
      hasDot &&
      !hasComma
    ){

      const afterDot =
        s.split('.').pop();


      if(
        afterDot.length === 3
      ){

        s =
          s.replace(
            /\./g,
            ''
          );

      }

    }


    const n =
      parseFloat(s);


    return isNaN(n)
      ? 0
      : n;

  }


  function formatCLP(n){

    return (
      '$' +
      Math.round(n)
        .toLocaleString(
          'es-CL'
        )
    );

  }


  /* =========================================================
     VALIDACIÓN EAN-13
  ========================================================= */

  function isValidEAN13(code){

    if(
      !/^\d{13}$/.test(code)
    ){

      return false;

    }


    let sum = 0;


    for(
      let i = 0;
      i < 12;
      i++
    ){

      const digit =
        parseInt(
          code[i],
          10
        );


      sum +=
        i % 2 === 0
          ? digit
          : digit * 3;

    }


    const checkDigit =
      (
        10 -
        (
          sum % 10
        )
      ) % 10;


    return (
      checkDigit ===
      parseInt(
        code[12],
        10
      )
    );

  }


  /* =========================================================
     VALIDACIÓN EAN-8
  ========================================================= */

  function isValidEAN8(code){

    if(
      !/^\d{8}$/.test(code)
    ){

      return false;

    }


    let sum = 0;


    for(
      let i = 0;
      i < 7;
      i++
    ){

      const digit =
        parseInt(
          code[i],
          10
        );


      sum +=
        i % 2 === 0
          ? digit * 3
          : digit;

    }


    const checkDigit =
      (
        10 -
        (
          sum % 10
        )
      ) % 10;


    return (
      checkDigit ===
      parseInt(
        code[7],
        10
      )
    );

  }


  /* =========================================================
     VALIDACIÓN UPC-A
  ========================================================= */

  function isValidUPCA(code){

    if(
      !/^\d{12}$/.test(code)
    ){

      return false;

    }


    let sum = 0;


    for(
      let i = 0;
      i < 11;
      i++
    ){

      const digit =
        parseInt(
          code[i],
          10
        );


      sum +=
        i % 2 === 0
          ? digit * 3
          : digit;

    }


    const checkDigit =
      (
        10 -
        (
          sum % 10
        )
      ) % 10;


    return (
      checkDigit ===
      parseInt(
        code[11],
        10
      )
    );

  }


  /* =========================================================
     VALIDACIÓN ESTRUCTURAL
  ========================================================= */

  function isStructurallyValidBarcode(code){

    /*
     * EAN-13
     */
    if(
      /^\d{13}$/.test(code)
    ){

      return isValidEAN13(
        code
      );

    }


    /*
     * EAN-8
     */
    if(
      /^\d{8}$/.test(code)
    ){

      return isValidEAN8(
        code
      );

    }


    /*
     * UPC-A
     */
    if(
      /^\d{12}$/.test(code)
    ){

      return isValidUPCA(
        code
      );

    }


    /*
     * CODE128 / CODE39:
     * no aplicamos checksum aquí.
     */
    return true;

  }

  /* =========================================================
     SCANNER
  ========================================================= */


  function onScanSuccess(
    decodedText
  ){

    /*
     * Si estamos mostrando un producto
     * no procesamos nuevas lecturas.
     */

    if(scannerLocked)
      return;


    /*
     * El catálogo debe estar cargado.
     */

    if(!catalogReady){

      statusText.textContent =
        "catálogo aún no cargado, espera…";

      return;

    }


    const sku =
      normalizeSku(
        decodedText
      );


    if(!sku)
      return;


    /* =====================================================
       1. VALIDAR FORMATO / CHECKSUM
    ===================================================== */

    if(
      !isStructurallyValidBarcode(
        sku
      )
    ){

      /*
       * La lectura tiene un checksum
       * incorrecto.
       *
       * La descartamos inmediatamente.
       */

      scanCandidate = "";

      scanCandidateCount = 0;

      if(isIOS){

        statusText.textContent =
          "lectura descartada…";

      }

      return;

    }


    /* =====================================================
       2. EN IPHONE EXIGIR VARIAS LECTURAS IGUALES
    ===================================================== */

    if(
      sku ===
      scanCandidate
    ){

      scanCandidateCount++;

    }else{

      scanCandidate =
        sku;

      scanCandidateCount =
        1;

    }


    /*
     * Android mantiene la velocidad original.
     *
     * iPhone debe confirmar 3 veces.
     */

    if(
      scanCandidateCount <
      REQUIRED_CONFIRMATIONS
    ){

      if(isIOS){

        statusText.textContent =
          `confirmando código… ${scanCandidateCount}/${REQUIRED_CONFIRMATIONS}`;

      }

      return;

    }


    /* =====================================================
       3. EVITAR DUPLICADOS
    ===================================================== */

    const now =
      Date.now();


    if(
      sku ===
      lastAcceptedScan &&
      (
        now -
        lastAcceptedTime
      ) <
      ACCEPT_COOLDOWN
    ){

      return;

    }


    /* =====================================================
       4. ACEPTAR CÓDIGO
    ===================================================== */

    lastAcceptedScan =
      sku;

    lastAcceptedTime =
      now;


    scanCandidate =
      "";

    scanCandidateCount =
      0;


    scannerLocked =
      true;


    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        60
      );

    }


    /*
     * Buscar producto.
     */

    const row =
      catalogIndex[sku];


    /*
     * Mostrar resultado.
     */

    showTicket(
      row,
      sku
    );


    statusText.textContent =
      "";

  }


  /* =========================================================
     PREPARAR VIDEO PARA IOS
  ========================================================= */

  function watchVideoForIOS(){

    const container =
      document.getElementById(
        'reader'
      );


    if(!container)
      return;


    function configureVideo(
      videoElem
    ){

      if(!videoElem)
        return;


      videoElem.setAttribute(
        "playsinline",
        ""
      );


      videoElem.setAttribute(
        "webkit-playsinline",
        ""
      );


      videoElem.setAttribute(
        "autoplay",
        ""
      );


      videoElem.setAttribute(
        "muted",
        ""
      );


      videoElem.muted =
        true;


      videoElem.autoplay =
        true;


      videoElem.playsInline =
        true;


      /*
       * Intentamos reproducir.
       * En iOS el start() ya ocurre después
       * de la interacción del usuario.
       */

      const promise =
        videoElem.play();


      if(
        promise &&
        typeof promise.catch ===
        'function'
      ){

        promise.catch(
          () => {}
        );

      }

    }


    const existingVideo =
      container.querySelector(
        'video'
      );


    if(existingVideo){

      configureVideo(
        existingVideo
      );

      return;

    }


    const observer =
      new MutationObserver(
        () => {

          const videoElem =
            container.querySelector(
              'video'
            );


          if(videoElem){

            configureVideo(
              videoElem
            );

            observer.disconnect();

          }

        }
      );


    observer.observe(
      container,
      {
        childList:true,
        subtree:true
      }
    );

  }


  /* =========================================================
     ZONA DE ESCANEO
  ========================================================= */

  function getScanBox(
    viewfinderWidth,
    viewfinderHeight
  ){

    /*
     * Código de barras:
     * ancho grande y alto relativamente pequeño.
     */

    let width =
      Math.floor(
        viewfinderWidth *
        0.90
      );


    let height =
      Math.floor(
        Math.min(
          220,
          viewfinderHeight *
          0.35
        )
      );


    width =
      Math.max(
        280,
        width
      );


    height =
      Math.max(
        110,
        height
      );


    /*
     * No superar el contenedor.
     */

    width =
      Math.min(
        width,
        viewfinderWidth -
        20
      );


    height =
      Math.min(
        height,
        viewfinderHeight -
        20
      );


    return {
      width,
      height
    };

  }


  /* =========================================================
     CREAR SCANNER
  ========================================================= */

  function createScanner(){

    /*
     * Si existe un scanner anterior,
     * intentamos limpiarlo.
     */

    if(html5QrCode){

      try{

        html5QrCode.clear();

      }catch(e){

        console.warn(
          "No se pudo limpiar scanner anterior",
          e
        );

      }

    }


    /*
     * IMPORTANTE:
     *
     * Android:
     * mantiene BarcodeDetector si está disponible.
     *
     * iPhone:
     * lo desactivamos porque estamos intentando
     * evitar las lecturas incorrectas que detectaste.
     */

    html5QrCode =
      new Html5Qrcode(
        "reader",
        {

          verbose:false,

          useBarCodeDetectorIfSupported:
            !isIOS,

          formatsToSupport:[

            Html5QrcodeSupportedFormats.EAN_13,

            Html5QrcodeSupportedFormats.EAN_8,

            Html5QrcodeSupportedFormats.UPC_A,

            Html5QrcodeSupportedFormats.UPC_E,

            Html5QrcodeSupportedFormats.CODE_128,

            Html5QrcodeSupportedFormats.CODE_39,

            Html5QrcodeSupportedFormats.QR_CODE

          ]

        }
      );

  }


  /* =========================================================
     BUSCAR CÁMARA TRASERA
  ========================================================= */

  async function findBackCamera(){

    try{

      if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.enumerateDevices
      ){

        return null;

      }


      const devices =
        await navigator
          .mediaDevices
          .enumerateDevices();


      const cameras =
        devices.filter(
          device =>
            device.kind ===
            'videoinput'
        );


      if(
        !cameras.length
      ){

        return null;

      }


      /*
       * Buscar cámara trasera
       * por nombre.
       */

      const backCamera =
        cameras.find(
          camera =>
            /back|rear|environment|trasera|posterior/i
              .test(
                camera.label ||
                ""
              )
        );


      if(backCamera){

        return backCamera.deviceId;

      }


      /*
       * Fallback.
       */

      return cameras[
        cameras.length - 1
      ].deviceId;


    }catch(err){

      console.warn(
        "No se pudo enumerar cámaras:",
        err
      );


      return null;

    }

  }


  /* =========================================================
     INICIAR SCANNER
  ========================================================= */

  async function startScanner(){

    if(scannerStarting)
      return;


    scannerStarting =
      true;


    const cameraError =
      document.getElementById(
        'camera-error'
      );


    cameraError.classList.remove(
      'show'
    );


    try{

      if(
        typeof Html5Qrcode ===
        'undefined'
      ){

        throw new Error(
          "La librería html5-qrcode no se cargó."
        );

      }


      /*
       * La cámara requiere HTTPS.
       */

      if(
        location.protocol !==
          'https:' &&
        location.hostname !==
          'localhost' &&
        location.hostname !==
          '127.0.0.1'
      ){

        throw new Error(
          "La cámara requiere HTTPS."
        );

      }


      createScanner();


      /*
       * Para iPhone buscamos primero
       * la cámara trasera.
       *
       * Para Android también intentamos
       * encontrarla, pero tenemos fallback
       * a facingMode.
       */

      selectedCameraId =
        await findBackCamera();


      /*
       * Preparar video antes de start().
       */

      watchVideoForIOS();


      const scannerConfig = {

        /*
         * Android conserva 10 FPS.
         * iPhone usa 12 para mejorar
         * la cantidad de muestras.
         */

        fps:
          isIOS
            ? 12
            : 10,


        /*
         * Área específica para códigos
         * de barras largos.
         */

        qrbox:
          getScanBox,


        /*
         * No hacemos espejo.
         */

        disableFlip:false

      };


      /* =====================================================
         PRIMER INTENTO: ID DE CÁMARA
      ===================================================== */

      if(
        selectedCameraId
      ){

        try{

          await html5QrCode.start(

            selectedCameraId,

            scannerConfig,

            onScanSuccess,

            () => {}

          );


          scannerStarting =
            false;


          return;


        }catch(firstError){

          console.warn(
            "Falló inicio por ID de cámara:",
            firstError
          );

        }

      }


      /* =====================================================
         SEGUNDO INTENTO: FACING MODE
      ===================================================== */

      await html5QrCode.start(

        {
          facingMode:{
            exact:"environment"
          }
        },

        scannerConfig,

        onScanSuccess,

        () => {}

      );


      scannerStarting =
        false;


    }catch(err){

      console.error(err);


      showDebugError(
        "No se pudo iniciar la cámara: " +
        (
          err &&
          err.message
            ? err.message
            : err
        )
      );


      scannerStarting =
        false;


      cameraError.classList.add(
        'show'
      );


      /*
       * En iPhone volvemos a mostrar
       * el botón.
       */

      if(isIOS){

        showIOSStartOverlay();

      }

    }

  }

  /* =========================================================
     INICIALIZACIÓN
  ========================================================= */

  async function initializeApp(){

    /*
     * El catálogo se carga igual
     * para todos los dispositivos.
     */

    loadCatalog();


    /*
     * ANDROID:
     *
     * Mantiene inicio automático.
     */

    if(!isIOS){

      startScanner();

    }


    /*
     * IPHONE / IPAD:
     *
     * Esperamos interacción del usuario.
     */

    if(isIOS){

      statusText.textContent =
        "toca para activar cámara";


      showIOSStartOverlay();

    }

  }


  /* =========================================================
     ARRANCAR
  ========================================================= */

  initializeApp();


  /*
   * Actualizar catálogo cada 3 minutos.
   */

  setInterval(
    loadCatalog,
    3 * 60 * 1000
  );

</script>

</body>
</html>
