<style>
:root{
  --bg:#14100e;
  --surface:#201a16;
  --surface-2:#2a221c;
  --line:#3a3128;
  --text:#f2e9de;
  --text-muted:#a79684;
  --accent:#c9622a;
  --gold:#d4af37;
  --error:#c0453a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  height:100%;
  height:100dvh;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

header{
  padding:16px 20px 12px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
  z-index:5;
  background:var(--bg);
}

header .eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
}

header h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:20px;
  margin:2px 0 0;
}

#status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--text-muted);
  flex-shrink:0;
}

#status-dot.ready{
  background:#5fae7a;
}

#status-dot.error{
  background:var(--error);
}

.status-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-muted);
}

/* =========================================================
   SCANNER
========================================================= */

#scanner-wrap{
  position:relative;
  flex:1;
  min-height:0;
  background:#000;
}

#reader{
  width:100%;
  height:100%;
}

#reader video{
  width:100% !important;
  height:100% !important;
  object-fit:cover !important;
  display:block;

  /*
   * Muy importante para Safari/iOS.
   */
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
}

#reader__dashboard,
#reader__header_message,
#reader__filescan_input,
#reader__camera_selection{
  display:none !important;
}

#reader__scan_region{
  border:none !important;
}

#reader__scan_region img{
  display:none !important;
}

/* =========================================================
   VISOR
========================================================= */

.viewfinder{
  position:absolute;
  inset:0;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.viewfinder .frame{
  width:88%;
  max-width:520px;
  height:190px;
  position:relative;
}

.viewfinder .corner{
  position:absolute;
  width:30px;
  height:30px;
  border:3px solid var(--accent);
}

.viewfinder .corner.tl{
  top:0;
  left:0;
  border-right:none;
  border-bottom:none;
  border-top-left-radius:8px;
}

.viewfinder .corner.tr{
  top:0;
  right:0;
  border-left:none;
  border-bottom:none;
  border-top-right-radius:8px;
}

.viewfinder .corner.bl{
  bottom:0;
  left:0;
  border-right:none;
  border-top:none;
  border-bottom-left-radius:8px;
}

.viewfinder .corner.br{
  bottom:0;
  right:0;
  border-left:none;
  border-top:none;
  border-bottom-right-radius:8px;
}

.viewfinder .scanline{
  position:absolute;
  left:4%;
  right:4%;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--accent),
    transparent
  );
  box-shadow:0 0 8px 1px var(--accent);
  animation:sweep 2.2s ease-in-out infinite;
}

@keyframes sweep{
  0%,100%{
    top:8%;
    opacity:.9;
  }

  50%{
    top:92%;
    opacity:.5;
  }
}

.hint{
  position:absolute;
  bottom:22px;
  left:0;
  right:0;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  letter-spacing:.06em;
  color:var(--text-muted);
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}

/* =========================================================
   ERROR CÁMARA
========================================================= */

#camera-error{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:32px;
  text-align:center;
  background:var(--bg);
  z-index:20;
}

#camera-error.show{

}

#camera-error p{
  color:var(--text-muted);
  font-size:14px;
  line-height:1.5;
  margin:0;
}

#camera-error button{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:12px 22px;
  border-radius:999px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:14px;
}

/* =========================================================

========================================================= */

}

#ios-tap-start .ios-title{

#ios-tap-start .ios-description{

}

#ios-tap-start button{

  color:#fff;

/* =========================================================

========================================================= */

<script>

/* =========================================================
   DEBUG
========================================================= */

function showDebugError(msg){

  let box =
    document.getElementById(
      'debug-error-box'
    );

  if(!box){

    box =
      document.createElement(
        'div'
      );

    box.id =
      'debug-error-box';

    document.body.appendChild(
      box
    );

  }

  box.textContent +=
    (
      box.textContent
        ? "\n---\n"
        : ""
    ) + msg;

}


window.addEventListener(
  'error',
  e => {

    showDebugError(
      "JS ERROR: " +
      e.message +
      " (línea " +
      e.lineno +
      ")"
    );

  }
);


window.addEventListener(
  'unhandledrejection',
  e => {

    showDebugError(
      "PROMISE ERROR: " +
      (
        e.reason &&
        e.reason.message
          ? e.reason.message
          : e.reason
      )
    );

  }
);


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const SHEET_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRCTJ02RhdYcZqjlrKneeA7IUVq9TT-jhGAVRRY9X6XKIy038KNtfw1Tamao2yMyA/pub?gid=540197870&single=true&output=csv";


const COLS = {

  sku:"SKU",

  artista:"Artista",

  titulo:"Título",

  precio:"Precio",

  precioClub:"Precio Club de lectores",

  imagen:"Imagen"

};


/* =========================================================
   DETECTAR IOS
========================================================= */

const isIOS =
  /iPad|iPhone|iPod/.test(
    navigator.userAgent
  ) ||
  (
    navigator.platform ===
    "MacIntel" &&
    navigator.maxTouchPoints > 1
  );


/* =========================================================
   VARIABLES
========================================================= */

const statusDot =
  document.getElementById(
    'status-dot'
  );

const statusText =
  document.getElementById(
    'status-text'
  );


let catalogIndex = {};

let catalogReady = false;

let html5QrCode = null;

let scannerLocked = false;

let scannerStarting = false;


/* =========================================================
   FILTRO DE LECTURA
========================================================= */

/*
 * Android:
 * acepta una lectura.
 *
 * iPhone:
 * necesita 2 lecturas iguales.
 *
 * Bajamos de 3 a 2 porque la versión
 * anterior estaba siendo demasiado lenta.
 */

const REQUIRED_CONFIRMATIONS =
  isIOS ? 2 : 1;


/*
 * Tiempo durante el cual no aceptamos
 * nuevamente el mismo código.
 */

const ACCEPT_COOLDOWN =
  isIOS ? 1200 : 1000;


let candidateCode = "";

let candidateCount = 0;

let lastAcceptedCode = "";

let lastAcceptedTime = 0;


/* =========================================================
   NORMALIZAR SKU
========================================================= */

function normalizeSku(value){

  return (
    value ||
    ""
  )
  .toString()
  .trim()
  .toUpperCase();

}


/* =========================================================
   IMÁGENES
========================================================= */

function toDirectImageUrl(url){

  if(!url)
    return "";

  url =
    url.trim();


  const driveMatch =
    url.match(
      /drive\.google\.com\/file\/d\/([^/]+)/
    );


  if(driveMatch){

    return (
      "https://drive.google.com/uc?export=view&id=" +
      driveMatch[1]
    );

  }


  const driveIdMatch =
    url.match(
      /[?&]id=([^&]+)/
    );


  if(
    driveIdMatch &&
    url.includes(
      "drive.google.com"
    )
  ){

    return (
      "https://drive.google.com/uc?export=view&id=" +
      driveIdMatch[1]
    );

  }


  return url;

}


/* =========================================================
   CATÁLOGO
========================================================= */

async function loadCatalog(){

  statusText.textContent =
    "cargando catálogo…";

  statusDot.className =
    "";


  try{

    const res =
      await fetch(
        SHEET_CSV_URL,
        {
          cache:"no-store"
        }
      );


    if(!res.ok){

      throw new Error(
        "HTTP " +
        res.status
      );

    }


    const csvText =
      await res.text();


    const parsed =
      Papa.parse(
        csvText,
        {
          header:true,
          skipEmptyLines:true
        }
      );


    catalogIndex = {};


    parsed.data.forEach(
      row => {

        const sku =
          normalizeSku(
            row[COLS.sku]
          );


        if(sku){

          catalogIndex[sku] =
            row;

        }

      }
    );


    catalogReady =
      true;


    statusDot.className =
      "ready";


    statusText.textContent =
      "";


  }catch(err){

    console.error(err);


    showDebugError(
      "Error cargando catálogo: " +
      err.message
    );


    statusDot.className =
      "error";


    statusText.textContent =
      "error al cargar catálogo";

  }

}


/* =========================================================
   PRECIOS
========================================================= */

function formatPrice(v){

  if(
    v === undefined ||
    v === null ||
    v.toString().trim() === ""
  ){

    return "—";

  }


  const cleaned =
    v
      .toString()
      .replace(
        /[^\d.,-]/g,
        ""
      );


  return cleaned
    ? `$${cleaned}`
    : v;

}


function parsePrice(raw){

  if(
    raw === undefined ||
    raw === null
  ){

    return 0;

  }


  let s =
    raw
      .toString()
      .trim()
      .replace(
        /[^\d.,]/g,
        ""
      );


  if(!s)
    return 0;


  const hasDot =
    s.includes('.');

  const hasComma =
    s.includes(',');


  if(
    hasDot &&
    hasComma
  ){

    s =
      s
        .replace(
          /\./g,
          ""
        )
        .replace(
          ',',
          '.'
        );

  }else if(
    hasComma &&
    !hasDot
  ){

    s =
      s.replace(
        ',',
        '.'
      );

  }else if(
    hasDot &&
    !hasComma
  ){

    const afterDot =
      s.split('.').pop();


    if(
      afterDot.length === 3
    ){

      s =
        s.replace(
          /\./g,
          ""
        );

    }

  }


  const n =
    parseFloat(s);


  return isNaN(n)
    ? 0
    : n;

}


function formatCLP(n){

  return (
    '$' +
    Math.round(n)
      .toLocaleString(
        'es-CL'
      )
  );

}

/* =========================================================
   CARRITO
========================================================= */

let cartItems = [];


function addToCart(row){

  cartItems.push({

    sku:
      normalizeSku(
        row[COLS.sku]
      ),

    titulo:
      row[COLS.titulo] ||
      "Sin título",

    precio:
      parsePrice(
        row[COLS.precio]
      ),

    precioClub:
      parsePrice(
        row[COLS.precioClub]
      )

  });


  renderCartBar();

}


function renderCartBar(){

  const bar =
    document.getElementById(
      'cart-bar'
    );


  document.getElementById(
    'cart-count'
  ).textContent =
    `${cartItems.length} producto${
      cartItems.length === 1
        ? ''
        : 's'
    }`;


  document.getElementById(
    'cart-total'
  ).textContent =
    "Ver Total";


  bar.classList.toggle(
    'show',
    cartItems.length > 0
  );

}


function cartTotal(mode){

  const key =
    mode === 'club'
      ? 'precioClub'
      : 'precio';


  return cartItems.reduce(
    (
      sum,
      item
    ) =>
      sum +
      (
        item[key] ||
        0
      ),
    0
  );

}


let activePriceMode =
  'normal';


function renderCartSheet(){

  const sheet =
    document.getElementById(
      'cart-sheet'
    );


  const totalNormal =
    cartTotal(
      'normal'
    );


  const totalClub =
    cartTotal(
      'club'
    );


  const rows =
    cartItems
      .map(
        (
          item,
          idx
        ) => `

          <div class="cart-item">

            <div class="info">

              <div class="t">
                ${item.titulo}
              </div>

              <div class="s">
                ${item.sku}
              </div>

            </div>


            <div class="p">

              ${formatCLP(
                item.precio
              )}

              <span class="club">
                ${formatCLP(
                  item.precioClub
                )}
              </span>

            </div>


            <button
              class="rm"
              onclick="removeFromCart(${idx})"
            >
              ×
            </button>

          </div>

        `
      )
      .join('');


  sheet.innerHTML = `

    <h2>
      Productos guardados
    </h2>


    ${
      rows ||
      '<p style="color:var(--text-muted);font-size:13px;">Todavía no guardaste ningún producto.</p>'
    }


    <div class="totals-block">

      <div
        class="cart-total-row"
        onclick="setActivePriceMode('normal')"
        style="cursor:pointer;"
      >

        <span class="label">
          Total (Precio normal)
          ${
            activePriceMode ===
            'normal'
              ? '✓'
              : ''
          }
        </span>

        <span class="value">
          ${formatCLP(
            totalNormal
          )}
        </span>

      </div>


      <div
        class="cart-total-row club"
        onclick="setActivePriceMode('club')"
        style="cursor:pointer;"
      >

        <span class="label">
          Total (Club de lectores)
          ${
            activePriceMode ===
            'club'
              ? '✓'
              : ''
          }
        </span>

        <span class="value">
          ${formatCLP(
            totalClub
          )}
        </span>

      </div>

    </div>


    <button id="cart-clear">
      Vaciar lista
    </button>

    <button id="cart-close">
      Cerrar
    </button>

  `;


  document
    .getElementById(
      'cart-close'
    )
    .addEventListener(
      'click',
      closeCart
    );


  document
    .getElementById(
      'cart-clear'
    )
    .addEventListener(
      'click',
      () => {

        cartItems = [];

        renderCartBar();

        renderCartSheet();

      }
    );

}


function setActivePriceMode(
  mode
){

  activePriceMode =
    mode;

  renderCartSheet();

}


function removeFromCart(
  idx
){

  cartItems.splice(
    idx,
    1
  );

  renderCartBar();

  renderCartSheet();

}


function openCart(){

  renderCartSheet();

  document
    .getElementById(
      'cart-sheet'
    )
    .classList.add(
      'show'
    );


  scannerLocked =
    true;

}


function closeCart(){

  document
    .getElementById(
      'cart-sheet'
    )
    .classList.remove(
      'show'
    );


  scannerLocked =
    false;

}


function closeTicket(){

  document
    .getElementById(
      'ticket'
    )
    .classList.remove(
      'show'
    );


  document
    .getElementById(
      'ticket-scrim'
    )
    .classList.remove(
      'show'
    );


  candidateCode =
    "";

  candidateCount =
    0;


  setTimeout(
    () => {

      scannerLocked =
        false;

    },
    200
  );

}


/* =========================================================
   LECTURA
========================================================= */

function onScanSuccess(
  decodedText
){

  if(scannerLocked)
    return;


  if(!catalogReady){

    statusText.textContent =
      "catálogo aún no cargado, espera…";

    return;

  }


  const sku =
    normalizeSku(
      decodedText
    );


  if(!sku)
    return;


  /*
   * =======================================================
   * PRIMER FILTRO:
   * EL CÓDIGO TIENE QUE EXISTIR EN EL CATÁLOGO
   *
   * Esto es fundamental para evitar que una lectura
   * incorrecta de iPhone termine mostrando otro producto.
   * =======================================================
   */

  const row =
    catalogIndex[sku];


  if(!row){

    /*
     * NO mostramos "SKU no encontrado".
     *
     * Simplemente descartamos la lectura y seguimos
     * escaneando.
     */

    candidateCode =
      "";

    candidateCount =
      0;


    if(isIOS){

      statusText.textContent =
        "buscando código…";

    }

    return;

  }


  /*
   * =======================================================
   * SEGUNDO FILTRO:
   * CONFIRMAR LA MISMA LECTURA
   * =======================================================
   */

  if(
    sku ===
    candidateCode
  ){

    candidateCount++;

  }else{

    candidateCode =
      sku;

    candidateCount =
      1;

  }


  /*
   * Android:
   * 1 lectura.
   *
   * iPhone:
   * 2 lecturas iguales.
   */

  if(
    candidateCount <
    REQUIRED_CONFIRMATIONS
  ){

    if(isIOS){

      statusText.textContent =
        `confirmando… ${candidateCount}/${REQUIRED_CONFIRMATIONS}`;

    }

    return;

  }


  /*
   * =======================================================
   * EVITAR DUPLICADO INMEDIATO
   * =======================================================
   */

  const now =
    Date.now();


  if(
    sku ===
    lastAcceptedCode &&
    (
      now -
      lastAcceptedTime
    ) <
    ACCEPT_COOLDOWN
  ){

    return;

  }


  /*
   * =======================================================
   * ACEPTAR
   * =======================================================
   */

  lastAcceptedCode =
    sku;

  lastAcceptedTime =
    now;


  candidateCode =
    "";

  candidateCount =
    0;


  scannerLocked =
    true;


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      60
    );

  }


  statusText.textContent =
    "";


  showTicket(
    row,
    sku
  );

}


/* =========================================================
   VIDEO IOS
========================================================= */

function configureIOSVideo(
  video
){

  if(!video)
    return;


  video.setAttribute(
    "playsinline",
    "true"
  );

  video.setAttribute(
    "webkit-playsinline",
    "true"
  );

  video.setAttribute(
    "autoplay",
    "true"
  );

  video.setAttribute(
    "muted",
    "true"
  );


  video.muted =
    true;

  video.autoplay =
    true;

  video.playsInline =
    true;


  /*
   * Intentar reproducir.
   */

  const promise =
    video.play();


  if(
    promise &&
    promise.catch
  ){

    promise.catch(
      () => {}
    );

  }

}


function watchVideo(){

  const container =
    document.getElementById(
      'reader'
    );


  if(!container)
    return;


  const existing =
    container.querySelector(
      'video'
    );


  if(existing){

    configureIOSVideo(
      existing
    );

  }


  const observer =
    new MutationObserver(
      () => {

        const video =
          container.querySelector(
            'video'
          );


        if(video){

          configureIOSVideo(
            video
          );

        }

      }
    );


  observer.observe(
    container,
    {
      childList:true,
      subtree:true
    }
  );

}


/* =========================================================
   OVERLAY IOS
========================================================= */

function showIOSStartOverlay(){

  if(
    document.getElementById(
      'ios-tap-start'
    )
  ){

    return;

  }


  const overlay =
    document.createElement(
      'div'
    );


  overlay.id =
    'ios-tap-start';


  overlay.innerHTML = `

    <div class="ios-title">
      Activar cámara
    </div>

    <div class="ios-description">

      Toca el botón para activar
      la cámara y comenzar a
      escanear códigos de barras.

    </div>

    <button id="ios-tap-start-btn">
      Activar cámara
    </button>

  `;


  document.body.appendChild(
    overlay
  );


  document
    .getElementById(
      'ios-tap-start-btn'
    )
    .addEventListener(
      'click',
      async () => {

        overlay.remove();

        await startScanner();

      },
      {
        once:true
      }
    );

}

async function startScanner(){

if(scannerStarting)
return;

scannerStarting = true;

try{

```

errorBox.classList.remove('show');


if(typeof Html5Qrcode === 'undefined'){

/* =========================================================
   REINTENTAR
========================================================= */

function retryCamera(){

  const errorBox =
    document.getElementById(
      'camera-error'
    );


  errorBox.classList.remove(
    'show'
  );


  if(isIOS){

    showIOSStartOverlay();

  }else{

    startScanner();

  }

}


/* =========================================================
   INICIO
========================================================= */

async function initializeApp(){

  /*
   * Cargar catálogo.
   */

  await loadCatalog();


  /*
   * Android:
   * inicia automáticamente.
   */

  if(!isIOS){

    startScanner();

  }


  /*
   * iPhone:
   * requiere interacción.
   */

  if(isIOS){

    statusText.textContent =
      "toca para activar cámara";


    showIOSStartOverlay();

  }

}


initializeApp();


/*
 * Actualizar catálogo cada 3 minutos.
 */

setInterval(
  loadCatalog,
  3 * 60 * 1000
);
