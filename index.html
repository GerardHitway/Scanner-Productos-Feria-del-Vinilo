<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Escáner de stock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  :root{
    --bg:            #14100e;
    --surface:       #201a16;
    --surface-2:     #2a221c;
    --line:          #3a3128;
    --text:          #f2e9de;
    --text-muted:    #a79684;
    --accent:        #c9622a;
    --gold:          #d4af37;
    --error:         #c0453a;
    --radius:        18px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    height:100%;
    height:100dvh; /* iOS Safari: la barra de direcciones dinámica rompe 100vh/100% */
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  header{
    padding:16px 20px 12px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    z-index:5;
    background:var(--bg);
  }
  header .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    margin:2px 0 0;
    letter-spacing:-.01em;
  }
  header .header-right{
    display:flex;
    align-items:center;
    gap:14px;
    flex-shrink:0;
  }
  #search-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    width:36px; height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    padding:0;
  }
  #search-btn svg{ width:17px; height:17px; }
  #status-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--text-muted);
    flex-shrink:0;
    transition:background .3s;
  }
  #status-dot.ready{ background:#5fae7a; }
  #status-dot.error{ background:var(--error); }
  .status-wrap{ display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-muted); }

  #scanner-wrap{
    position:relative;
    flex:1;
    min-height:0;
    background:#000;
  }
  #reader{ width:100%; height:100%; }
  #reader video{ width:100% !important; height:100% !important; object-fit:cover; }

  #reader__dashboard, #reader__header_message, #reader__filescan_input, #reader__camera_selection{ display:none !important; }
  #reader__scan_region{ border:none !important; }
  #reader__scan_region img{ display:none !important; }

  .viewfinder{
    position:absolute; inset:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .viewfinder .frame{
    width:78%;
    max-width:420px;
    aspect-ratio:16/9;
    position:relative;
  }
  .viewfinder .corner{
    position:absolute;
    width:28px; height:28px;
    border:3px solid var(--accent);
  }
  .viewfinder .corner.tl{ top:0; left:0; border-right:none; border-bottom:none; border-top-left-radius:8px; }
  .viewfinder .corner.tr{ top:0; right:0; border-left:none; border-bottom:none; border-top-right-radius:8px; }
  .viewfinder .corner.bl{ bottom:0; left:0; border-right:none; border-top:none; border-bottom-left-radius:8px; }
  .viewfinder .corner.br{ bottom:0; right:0; border-left:none; border-top:none; border-bottom-right-radius:8px; }
  .viewfinder .scanline{
    position:absolute;
    left:6%; right:6%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow:0 0 8px 1px var(--accent);
    animation:sweep 2.2s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{ top:8%; opacity:.9; }
    50%{ top:92%; opacity:.5; }
  }
  .hint{
    position:absolute;
    bottom:22px; left:0; right:0;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:.06em;
    color:var(--text-muted);
    text-shadow:0 1px 4px rgba(0,0,0,.8);
  }

  #camera-error{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:32px;
    text-align:center;
    background:var(--bg);
  }
  #camera-error.show{ display:flex; }
  #camera-error p{ color:var(--text-muted); font-size:14px; line-height:1.5; margin:0; }
  #camera-error button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
  }

  #ticket-scrim{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:8;
  }
  #ticket-scrim.show{ opacity:1; pointer-events:auto; }

  #ticket{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:9;
    background:var(--surface);
    border-top-left-radius:24px;
    border-top-right-radius:24px;
    padding:10px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
    max-height:78vh;
    overflow-y:auto;
  }
  #ticket.show{ transform:translateY(0); }

  #ticket::before{
    content:"";
    display:block;
    width:36px; height:4px;
    background:var(--line);
    border-radius:3px;
    margin:0 auto 18px;
  }

  .ticket-row-top{
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .ticket-img{
    width:92px; height:92px;
    border-radius:10px;
    object-fit:cover;
    background:var(--surface-2);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .ticket-img.placeholder{
    display:flex; align-items:center; justify-content:center;
    color:var(--text-muted);
    font-size:10px;
    font-family:'JetBrains Mono',monospace;
    text-align:center;
    padding:6px;
  }
  .ticket-main{ min-width:0; flex:1; }
  .ticket-sku{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--accent);
    letter-spacing:.05em;
  }
  .ticket-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    line-height:1.2;
    margin:4px 0 2px;
  }
  .ticket-artist{
    color:var(--text-muted);
    font-size:14px;
  }

  .ticket-divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:18px 0 14px;
  }

  .price-grid{
    display:flex;
    gap:12px;
  }
  .price-card{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
  }
  .price-card .label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .price-card .value{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:20px;
    color:var(--gold);
    margin-top:4px;
  }
  .price-card.club .value{ color:var(--accent); }

  .ticket-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  #ticket-close, #ticket-save{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    padding:13px;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
  }
  #ticket-save{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  #ticket-save.saved{
    background:#5fae7a;
    border-color:#5fae7a;
  }

  /* ---------- Cart bar ---------- */
  #cart-bar{
    position:fixed;
    left:16px; right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:7;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px 18px;
    display:none;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #cart-bar.show{ display:flex; }
  #cart-bar .cart-count{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
  }
  #cart-bar .cart-total{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:16px;
    color:var(--gold);
  }

  #cart-sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:9;
    background:var(--surface);
    border-top-left-radius:24px;
    border-top-right-radius:24px;
    padding:10px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
    max-height:78vh;
    overflow-y:auto;
  }
  #cart-sheet.show{ transform:translateY(0); }
  #cart-sheet::before{
    content:"";
    display:block;
    width:36px; height:4px;
    background:var(--line);
    border-radius:3px;
    margin:0 auto 16px;
  }
  #cart-sheet h2{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:600;
    margin:0 0 14px;
  }
  .cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-item .info{ min-width:0; }
  .cart-item .info .t{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cart-item .info .s{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--text-muted);
  }
  .cart-item .p{
    font-family:'JetBrains Mono',monospace;
    color:var(--gold);
    font-size:13px;
    flex-shrink:0;
    text-align:right;
    line-height:1.5;
  }
  .cart-item .p .club{
    color:var(--accent);
    display:block;
    font-size:11.5px;
  }
  .cart-item .rm{
    background:none;
    border:none;
    color:var(--error);
    font-size:18px;
    line-height:1;
    padding:4px 6px;
    flex-shrink:0;
  }

  .totals-block{
    margin-top:6px;
  }
  .cart-total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    font-family:'JetBrains Mono',monospace;
    border-bottom:1px solid var(--line);
  }
  .cart-total-row:last-of-type{ border-bottom:none; }
  .cart-total-row .label{ color:var(--text-muted); font-size:12.5px; }
  .cart-total-row .value{ font-size:19px; font-weight:700; color:var(--gold); }
  .cart-total-row.club .value{ color:var(--accent); }

  #cart-clear, #cart-close{
    width:100%;
    padding:13px;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    margin-top:10px;
  }
  #cart-close{
    background:var(--accent);
    border:1px solid var(--accent);
    color:#fff;
  }
  #cart-clear{
    background:transparent;
    border:1px solid var(--line);
    color:var(--error);
  }

  .not-found .ticket-title{ color:var(--error); }
  .not-found-icon{
    font-family:'JetBrains Mono',monospace;
    font-size:34px;
    color:var(--error);
    text-align:center;
    margin-bottom:6px;
  }

  /* ---------- Search sheet ---------- */
  #search-scrim{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:8;
  }
  #search-scrim.show{ opacity:1; pointer-events:auto; }

  #search-sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:9;
    background:var(--surface);
    border-top-left-radius:24px;
    border-top-right-radius:24px;
    padding:10px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
    height:82vh;
    display:flex;
    flex-direction:column;
  }
  #search-sheet.show{ transform:translateY(0); }
  #search-sheet::before{
    content:"";
    display:block;
    width:36px; height:4px;
    background:var(--line);
    border-radius:3px;
    margin:0 auto 16px;
    flex-shrink:0;
  }
  #search-sheet h2{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:600;
    margin:0 0 12px;
    flex-shrink:0;
  }
  .search-input-wrap{
    position:relative;
    flex-shrink:0;
    margin-bottom:8px;
  }
  .search-input-wrap svg{
    position:absolute;
    left:14px; top:50%;
    transform:translateY(-50%);
    width:16px; height:16px;
    color:var(--text-muted);
    pointer-events:none;
  }
  #search-input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:13px 14px 13px 40px;
    outline:none;
  }
  #search-input:focus{ border-color:var(--accent); }
  #search-input::placeholder{ color:var(--text-muted); }

  #search-results{
    flex:1;
    overflow-y:auto;
    margin-top:6px;
  }
  .search-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
  }
  .search-result .r-info{ min-width:0; flex:1; }
  .search-result .r-title{
    font-size:14.5px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .search-result .r-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .search-result .r-price{
    font-family:'JetBrains Mono',monospace;
    color:var(--gold);
    font-size:13px;
    flex-shrink:0;
  }
  .search-empty{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    padding:30px 10px;
  }
  #search-close{
    width:100%;
    padding:13px;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    margin-top:12px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    flex-shrink:0;
  }

  #ios-tap-start{
    position: fixed; inset: 0; z-index: 9998;
    background: rgba(0,0,0,0.9); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-family: 'Inter', sans-serif;
  }
  #ios-tap-start button{
    margin-top:16px;
    padding:13px 26px;
    font-size:15px;
    border-radius:999px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:600;
  }

  #debug-error-box{
    position:fixed; top:0; left:0; right:0; z-index:99999;
    background:#c0453a; color:#fff; font-family:'JetBrains Mono',monospace;
    font-size:11px; padding:10px; white-space:pre-wrap;
    max-height:40vh; overflow:auto;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Punto de venta</div>
    <h1>Escanear producto</h1>
  </div>
  <div class="header-right">
    <button id="search-btn" onclick="openSearch()" aria-label="Buscar por nombre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
    <div class="status-wrap">
      <span id="status-dot"></span>
      <span id="status-text">cargando catálogo…</span>
    </div>
  </div>
</header>

<div id="scanner-wrap">
  <div id="reader"></div>

  <div class="viewfinder">
    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scanline"></div>
    </div>
  </div>
  <div class="hint">Apunta al código de barras</div>

  <div id="camera-error">
    <p>No pudimos acceder a la cámara.<br>Revisa los permisos del navegador y vuelve a intentar.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</div>

<div id="ticket-scrim" onclick="closeTicket()"></div>
<div id="ticket"></div>

<div id="search-scrim" onclick="closeSearch()"></div>
<div id="search-sheet">
  <h2>Buscar por nombre</h2>
  <div class="search-input-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="search-input" placeholder="Título, artista o SKU…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
  <div id="search-results"></div>
  <button id="search-close" onclick="closeSearch()">Cerrar</button>
</div>

<div id="cart-bar" onclick="openCart()">
  <span class="cart-count" id="cart-count">0 productos</span>
  <span class="cart-total" id="cart-total">Ver Total</span>
</div>
<div id="cart-sheet"></div>

<script>
  // ======= DEBUG VISIBLE EN PANTALLA =======
  function showDebugError(msg){
    let box = document.getElementById('debug-error-box');
    if(!box){
      box = document.createElement('div');
      box.id = 'debug-error-box';
      document.body.appendChild(box);
    }
    box.textContent += (box.textContent ? "\n---\n" : "") + msg;
  }
  window.addEventListener('error', (e) => {
    showDebugError("JS ERROR: " + e.message + " (línea " + e.lineno + ")");
  });
  window.addEventListener('unhandledrejection', (e) => {
    showDebugError("PROMISE ERROR: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  // ==========================================

  // ======= CONFIGURACIÓN =======
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRCTJ02RhdYcZqjlrKneeA7IUVq9TT-jhGAVRRY9X6XKIy038KNtfw1Tamao2yMyA/pub?gid=540197870&single=true&output=csv";

  const COLS = {
    sku: "SKU",
    artista: "Artista",
    titulo: "Título",
    precio: "Precio",
    precioClub: "Precio Club de lectores",
    imagen: "Imagen"
  };
  // ==============================

  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  let catalogIndex = {};
  let catalogRows = [];
  let catalogReady = false;
  let html5QrCode = null;

  function normalizeSku(s){
    return (s || "").toString().trim().toUpperCase();
  }

  function toDirectImageUrl(url){
    if(!url) return "";
    url = url.trim();
    const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
    if(driveMatch){
      return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
    }
    const driveIdMatch = url.match(/[?&]id=([^&]+)/);
    if(driveIdMatch && url.includes('drive.google.com')){
      return `https://drive.google.com/uc?export=view&id=${driveIdMatch[1]}`;
    }
    return url;
  }

  async function loadCatalog(){
    statusText.textContent = "cargando catálogo…";
    statusDot.className = "";
    try{
      const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const csvText = await res.text();
      const parsed = Papa.parse(csvText, { header:true, skipEmptyLines:true });
      catalogIndex = {};
      catalogRows = [];
      parsed.data.forEach(row => {
        const sku = normalizeSku(row[COLS.sku]);
        if(sku){
          catalogIndex[sku] = row;
          catalogRows.push(row);
        }
      });
      catalogReady = true;
      statusDot.className = "ready";
      statusText.textContent = "";
      // Si la búsqueda está abierta con texto, refresca resultados con el catálogo nuevo
      if(document.getElementById('search-sheet').classList.contains('show')){
        renderSearchResults(document.getElementById('search-input').value);
      }
    }catch(err){
      console.error(err);
      showDebugError("Error cargando catálogo: " + err.message);
      statusDot.className = "error";
      statusText.textContent = "error al cargar catálogo";
    }
  }

  function formatPrice(v){
    if(v === undefined || v === null || v.toString().trim() === "") return "—";
    const cleaned = v.toString().replace(/[^\d.,-]/g, '');
    return cleaned ? `$${cleaned}` : v;
  }

  function showTicket(row, skuScanned){
    const ticket = document.getElementById('ticket');
    const scrim = document.getElementById('ticket-scrim');

    if(!row){
      ticket.className = "not-found";
      ticket.innerHTML = `
        <div class="not-found-icon">✕</div>
        <div class="ticket-title" style="text-align:center;">SKU no encontrado</div>
        <div class="ticket-artist" style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; margin-top:6px;">${skuScanned}</div>
        <div class="ticket-actions">
          <button id="ticket-close" style="flex:1;">Seguir escaneando</button>
        </div>
      `;
    } else {
      const imgUrl = toDirectImageUrl(row[COLS.imagen]);
      ticket.className = "";
      ticket.innerHTML = `
        <div class="ticket-row-top">
          ${ imgUrl
            ? `<img class="ticket-img" src="${imgUrl}" onerror="this.outerHTML='<div class=&quot;ticket-img placeholder&quot;>sin imagen</div>'">`
            : `<div class="ticket-img placeholder">sin imagen</div>` }
          <div class="ticket-main">
            <div class="ticket-sku">${normalizeSku(row[COLS.sku])}</div>
            <div class="ticket-title">${row[COLS.titulo] || "Sin título"}</div>
            <div class="ticket-artist">${row[COLS.artista] || ""}</div>
          </div>
        </div>
        <hr class="ticket-divider">
        <div class="price-grid">
          <div class="price-card">
            <div class="label">Precio</div>
            <div class="value">${formatPrice(row[COLS.precio])}</div>
          </div>
          <div class="price-card club">
            <div class="label">Club de lectores</div>
            <div class="value">${formatPrice(row[COLS.precioClub])}</div>
          </div>
        </div>
        <div class="ticket-actions">
          <button id="ticket-close">Seguir escaneando</button>
          <button id="ticket-save">Guardar</button>
        </div>
      `;
    }

    document.getElementById('ticket-close').addEventListener('click', closeTicket);
    const saveBtn = document.getElementById('ticket-save');
    if(saveBtn){
      saveBtn.addEventListener('click', () => {
        addToCart(row);
        saveBtn.textContent = "Guardado ✓";
        saveBtn.classList.add('saved');
        saveBtn.disabled = true;
        setTimeout(closeTicket, 500);
      });
    }
    ticket.classList.add('show');
    scrim.classList.add('show');
  }

  // ---------- Carrito / suma ----------
  let cartItems = [];

  function parsePrice(raw){
    if(raw === undefined || raw === null) return 0;
    let s = raw.toString().trim().replace(/[^\d.,]/g, '');
    if(!s) return 0;
    const hasDot = s.includes('.');
    const hasComma = s.includes(',');
    if(hasDot && hasComma){
      s = s.replace(/\./g, '').replace(',', '.');
    } else if(hasComma && !hasDot){
      s = s.replace(',', '.');
    } else if(hasDot && !hasComma){
      const afterDot = s.split('.').pop();
      if(afterDot.length === 3){
        s = s.replace(/\./g, '');
      }
    }
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function formatCLP(n){
    return '$' + Math.round(n).toLocaleString('es-CL');
  }

  function addToCart(row){
    cartItems.push({
      sku: normalizeSku(row[COLS.sku]),
      titulo: row[COLS.titulo] || "Sin título",
      precio: parsePrice(row[COLS.precio]),
      precioClub: parsePrice(row[COLS.precioClub])
    });
    renderCartBar();
  }

  function renderCartBar(){
    const bar = document.getElementById('cart-bar');
    document.getElementById('cart-count').textContent =
      `${cartItems.length} producto${cartItems.length === 1 ? '' : 's'}`;
    document.getElementById('cart-total').textContent = "Ver Total";
    bar.classList.toggle('show', cartItems.length > 0);
  }

  function cartTotal(mode){
    const key = mode === 'club' ? 'precioClub' : 'precio';
    return cartItems.reduce((sum, i) => sum + (i[key] || 0), 0);
  }

  let activePriceMode = 'normal';

  function renderCartSheet(){
    const sheet = document.getElementById('cart-sheet');
    const totalNormal = cartTotal('normal');
    const totalClub = cartTotal('club');
    const rows = cartItems.map((item, idx) => `
      <div class="cart-item">
        <div class="info">
          <div class="t">${item.titulo}</div>
          <div class="s">${item.sku}</div>
        </div>
        <div class="p">
          ${formatCLP(item.precio)}
          <span class="club">${formatCLP(item.precioClub)}</span>
        </div>
        <button class="rm" onclick="removeFromCart(${idx})">×</button>
      </div>
    `).join('');
    sheet.innerHTML = `
      <h2>Productos guardados</h2>
      ${rows || '<p style="color:var(--text-muted); font-size:13px;">Todavía no guardaste ningún producto.</p>'}
      <div class="totals-block">
        <div class="cart-total-row normal" id="total-row-normal" onclick="setActivePriceMode('normal')" style="cursor:pointer;">
          <span class="label">Total (Precio normal) ${activePriceMode === 'normal' ? '✓' : ''}</span>
          <span class="value">${formatCLP(totalNormal)}</span>
        </div>
        <div class="cart-total-row club" id="total-row-club" onclick="setActivePriceMode('club')" style="cursor:pointer;">
          <span class="label">Total (Club de lectores) ${activePriceMode === 'club' ? '✓' : ''}</span>
          <span class="value">${formatCLP(totalClub)}</span>
        </div>
      </div>
      <button id="cart-clear">Vaciar lista</button>
      <button id="cart-close">Cerrar</button>
    `;
    document.getElementById('cart-close').addEventListener('click', closeCart);
    document.getElementById('cart-clear').addEventListener('click', () => {
      cartItems = [];
      renderCartBar();
      renderCartSheet();
    });
  }

  function setActivePriceMode(mode){
    activePriceMode = mode;
    renderCartSheet();
    renderCartBar();
  }

  function removeFromCart(idx){
    cartItems.splice(idx, 1);
    renderCartBar();
    renderCartSheet();
  }

  function openCart(){
    renderCartSheet();
    document.getElementById('cart-sheet').classList.add('show');
    scannerLocked = true;
  }

  function closeCart(){
    document.getElementById('cart-sheet').classList.remove('show');
    scannerLocked = false;
  }

  function closeTicket(){
    document.getElementById('ticket').classList.remove('show');
    document.getElementById('ticket-scrim').classList.remove('show');
    setTimeout(() => { scannerLocked = false; }, 200);
  }

  // ---------- Búsqueda por nombre ----------
  function normalizeText(s){
    return (s || "").toString()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // quita tildes
      .toLowerCase()
      .trim();
  }

  function openSearch(){
    scannerLocked = true;
    document.getElementById('search-sheet').classList.add('show');
    document.getElementById('search-scrim').classList.add('show');
    const input = document.getElementById('search-input');
    input.value = "";
    renderSearchResults("");
    setTimeout(() => input.focus(), 300);
  }

  function closeSearch(){
    document.getElementById('search-sheet').classList.remove('show');
    document.getElementById('search-scrim').classList.remove('show');
    document.getElementById('search-input').blur();
    setTimeout(() => { scannerLocked = false; }, 200);
  }

  function renderSearchResults(query){
    const resultsEl = document.getElementById('search-results');

    if(!catalogReady){
      resultsEl.innerHTML = `<div class="search-empty">Cargando catálogo…</div>`;
      return;
    }

    const q = normalizeText(query);
    let matches;
    if(!q){
      matches = catalogRows.slice(0, 40);
    } else {
      matches = catalogRows.filter(row => {
        const haystack = normalizeText(
          (row[COLS.titulo] || "") + " " + (row[COLS.artista] || "") + " " + (row[COLS.sku] || "")
        );
        return haystack.includes(q);
      }).slice(0, 60);
    }

    if(matches.length === 0){
      resultsEl.innerHTML = `<div class="search-empty">Sin resultados${q ? ` para "${query}"` : ""}.</div>`;
      return;
    }

    resultsEl.innerHTML = matches.map(row => `
      <div class="search-result" data-sku="${normalizeSku(row[COLS.sku])}">
        <div class="r-info">
          <div class="r-title">${row[COLS.titulo] || "Sin título"}</div>
          <div class="r-sub">${row[COLS.artista] || ""}${row[COLS.artista] ? " · " : ""}${normalizeSku(row[COLS.sku])}</div>
        </div>
        <div class="r-price">${formatPrice(row[COLS.precio])}</div>
      </div>
    `).join('');

    resultsEl.querySelectorAll('.search-result').forEach(el => {
      el.addEventListener('click', () => {
        const sku = el.getAttribute('data-sku');
        const row = catalogIndex[sku];
        closeSearch();
        setTimeout(() => showTicket(row, sku), 220);
      });
    });
  }

  let searchDebounce = null;
  document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    const val = e.target.value;
    searchDebounce = setTimeout(() => renderSearchResults(val), 120);
  });

  // ---------- Scanner ----------
  let scannerLocked = false;

  function onScanSuccess(decodedText){
    if(scannerLocked) return;
    if(!catalogReady){
      statusText.textContent = "catálogo aún no cargado, espera…";
      return;
    }
    scannerLocked = true;
    if(navigator.vibrate) navigator.vibrate(60);
    const sku = normalizeSku(decodedText);
    const row = catalogIndex[sku];
    showTicket(row, sku);
  }

  // Fuerza playsinline/muted en el <video> apenas se crea (crítico en iOS Safari,
  // si no, el video puede intentar fullscreen nativo y la app se ve en blanco)
  function watchVideoForIOS(){
    const container = document.getElementById('reader');
    if(!container) return;
    const observer = new MutationObserver(() => {
      const videoElem = container.querySelector('video');
      if (videoElem) {
        videoElem.setAttribute("playsinline", "true");
        videoElem.setAttribute("webkit-playsinline", "true");
        videoElem.muted = true;
        videoElem.setAttribute("muted", "true");
        videoElem.setAttribute("autoplay", "true");
        observer.disconnect();
      }
    });
    observer.observe(container, { childList: true, subtree: true });
  }

  function showTapToStartOverlay(retryFn){
    if(document.getElementById('ios-tap-start')) return;
    const overlay = document.createElement('div');
    overlay.id = 'ios-tap-start';
    overlay.innerHTML = `
      <div>Toca para activar la cámara</div>
      <button id="ios-tap-start-btn">Activar cámara</button>
    `;
    document.body.appendChild(overlay);
    document.getElementById('ios-tap-start-btn').addEventListener('click', async () => {
      overlay.remove();
      await retryFn();
    }, { once: true });
  }

  async function startScanner(){
    try {
      if(typeof Html5Qrcode === 'undefined'){
        throw new Error("La librería html5-qrcode no se cargó.");
      }

      html5QrCode = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.QR_CODE
        ],
        verbose:false
      });

      watchVideoForIOS();

      // Sin qrbox fijo: en iOS, si el contenedor aún no tiene alto real
      // cuando arranca la cámara, un qrbox de tamaño fijo (280x160) hace
      // que la librería falle en silencio. Escaneando el frame completo
      // se elimina ese punto de falla.
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10 },
        onScanSuccess,
        () => {}
      );

    } catch (err) {
      console.error(err);
      showDebugError("No se pudo iniciar la cámara: " + err.message);
      document.getElementById('camera-error').classList.add('show');
      showTapToStartOverlay(startScanner);
    }
  }

  loadCatalog();
  startScanner();
  setInterval(loadCatalog, 3 * 60 * 1000);
</script>

</body>
